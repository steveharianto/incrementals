<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIPHER</title>
<style>
:root{
  --bg:#0b0c0d; --panel:#0f1113; --line:#22262a; --line-hi:#3a4046;
  --dim:#6b7075; --dimmer:#4a4f54; --fg:#c8ccd0; --accent:#8fb0c8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
.wrap{max-width:1600px;margin:0 auto;padding:10px 12px 40px}

/* ---- header ---- */
header{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.hrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{letter-spacing:.32em;color:var(--fg)}
.hsp{flex:1}
.hbtn{background:none;border:1px solid var(--line);color:var(--dim);
  font:inherit;padding:0 7px;cursor:pointer}
.hbtn:hover{border-color:var(--line-hi);color:var(--fg)}
.tipline{color:var(--dim);margin-top:5px;min-height:1.5em}
.tipline b{color:var(--accent);font-weight:normal;margin-right:8px}
.tipx{border:none;background:none;color:var(--dimmer);font:inherit;cursor:pointer;margin-left:8px}
.tipx:hover{color:var(--fg)}

/* ---- layout ---- */
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--panel);padding:8px 9px;margin-bottom:10px}
.ptitle{color:var(--dim);letter-spacing:.2em;font-size:11px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ptitle span.r{letter-spacing:0;color:var(--dimmer)}

/* ---- rows / values ---- */
.row{display:flex;align-items:baseline;gap:8px;padding:1px 0}
.row .k{color:var(--dim);flex:0 0 auto}
.row .v{margin-left:auto;text-align:right;white-space:nowrap}
.num{white-space:nowrap}
.dimtxt{color:var(--dim)}
.dimmer{color:var(--dimmer)}
.acc{color:var(--accent)}
.bar{height:3px;background:#171a1d;border:0;margin:2px 0 5px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dimmer);width:0%}
.bar.on i{background:var(--accent)}

/* ---- buttons ---- */
button.b{display:block;width:100%;text-align:left;background:none;color:var(--fg);
  border:1px solid var(--line);font:inherit;padding:3px 6px;margin:3px 0;cursor:pointer}
button.b:hover{border-color:var(--line-hi)}
button.b[disabled]{color:var(--dimmer);border-color:var(--line);cursor:default}
button.b[disabled]:hover{border-color:var(--line)}
button.b.ok{border-color:var(--line-hi)}
button.b.ok .c{color:var(--accent)}
button.b .c{color:var(--dim);float:right;margin-left:10px}
button.b.on{border-color:var(--line-hi)}
button.s{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;
  width:20px;text-align:center;cursor:pointer;padding:0}
button.s:hover{border-color:var(--line-hi);color:var(--fg)}
button.s[disabled]{color:#2c3033;cursor:default}
.inline{display:flex;gap:4px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* ---- allocation ---- */
.alloc{display:grid;grid-template-columns:auto 20px 2.6em 20px auto;gap:4px;align-items:center;padding:2px 0}
.alloc .nm{color:var(--dim)}
.alloc .ct{text-align:center}
.alloc .rt{text-align:right;color:var(--dim);font-size:12px}

/* ---- glyph table ---- */
.gt{width:100%;border-collapse:collapse}
.gt th{color:var(--dimmer);font-weight:normal;text-align:right;font-size:11px;
  border-bottom:1px solid var(--line);padding:1px 3px}
.gt th.l{text-align:left}
.gt td{padding:1px 3px;text-align:right;border-bottom:1px solid #14171a;cursor:pointer}
.gt td.l{text-align:left}
.gt tr:hover td{background:#131619}
.gt tr.sel td{background:#171b1f}
.gt tr.pen td{color:var(--dimmer)}
.mini{height:2px;background:#171a1d;width:34px;display:inline-block;vertical-align:middle}
.mini i{display:block;height:100%;background:var(--dimmer)}
.mini.near i{background:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
.keys button{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;
  width:20px;padding:0;cursor:pointer}
.keys button:hover{border-color:var(--line-hi)}
.solved{color:var(--dim);word-spacing:2px;line-height:1.9}
.solved b{color:var(--fg);font-weight:normal}

/* ---- log ---- */
.log{max-height:300px;overflow-y:auto;line-height:1.7}
.log div{border-bottom:1px solid #131619;padding:1px 0}
.log .ts{color:var(--dimmer);margin-right:7px}
.log .d{color:var(--dim)}

/* ---- glyphs ---- */
svg.g{width:.66em;height:.95em;vertical-align:-.16em;stroke:currentColor;
  stroke-width:.42;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.w{white-space:nowrap;margin-right:.42em;display:inline-block}
.txt{line-height:2}

/* ---- guided tour: spotlight + card ---- */
.tb{position:fixed;inset:0;background:rgba(5,6,7,.88);z-index:55;display:none}
.tb.show{display:block}
.spot{position:relative;z-index:57;background:var(--panel);
  outline:1px solid var(--accent);outline-offset:2px}
.tc{position:fixed;z-index:58;width:340px;max-width:92vw;border:1px solid var(--line-hi);
  background:var(--panel);padding:10px 11px;display:none;left:20px;top:20px}
.tc.show{display:block}
.tc .grp{color:var(--dimmer);font-size:10px;letter-spacing:.2em;margin-bottom:3px}
.tc h3{margin:0 0 5px;font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:normal}
.tc p{margin:0 0 9px;color:var(--dim)}
.tc .nav{display:flex;gap:5px;align-items:center}
.tc .nav button{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;
  padding:1px 8px;cursor:pointer}
.tc .nav button:hover{border-color:var(--line-hi);color:var(--fg)}
.tc .nav button[disabled]{color:#2c3033;cursor:default}
.tc .nav button.pri{border-color:var(--line-hi);color:var(--fg)}
.tc .dots{margin-left:auto;color:var(--dimmer);font-size:11px}
textarea{width:100%;height:70px;background:#0a0b0c;color:var(--dim);border:1px solid var(--line);
  font:inherit;font-size:11px;padding:4px;resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <div class="hrow">
      <div class="brand">CIPHER</div>
      <div class="dimmer" id="hleg">legibility <span id="hlegv">0%</span></div>
      <div class="bar" id="hbar" style="width:150px;margin:0"><i></i></div>
      <div class="hsp"></div>
      <div class="dimmer" id="hstat"></div>
      <button class="hbtn" id="bhelp">?</button>
    </div>
    <div class="tipline" id="tipline"></div>
  </header>
  <div class="cols">
    <div id="c1"></div>
    <div id="c2"></div>
    <div id="c3"></div>
  </div>
</div>
<div class="tb" id="tb" data-a="tnext"></div>
<div class="tc" id="tc"></div>
<script>
"use strict";

/* ============================================================================
   1. DECIMAL - unbounded-exponent number type {m,e}, 1 <= |m| < 10
   R1: native floats die at 1e308; this game exceeds that.
   R4: hard exponent wall at 1e250; nothing may ever reach Infinity.
   ========================================================================== */
var EXP_WALL = 1e250;
var EXP_FLOOR = -320;

function D(m, e) {
  if (!(this instanceof D)) return new D(m, e);
  this.m = m === undefined ? 0 : m;
  this.e = e === undefined ? 0 : e;
  this.nrm();
}
D.prototype.nrm = function () {
  var m = this.m, e = this.e;
  if (typeof m !== "number" || typeof e !== "number" || !isFinite(m) || !isFinite(e)) {
    this.m = 1; this.e = EXP_WALL; return this;          // R4: walled, never Infinity
  }
  if (m === 0) { this.m = 0; this.e = 0; return this; }
  var d = Math.floor(Math.log10(Math.abs(m)));
  if (d !== 0 && isFinite(d)) { m = m / Math.pow(10, d); e += d; }
  var guard = 0;
  while (Math.abs(m) >= 10 && guard++ < 40) { m /= 10; e += 1; }
  while (Math.abs(m) < 1 && guard++ < 40) { m *= 10; e -= 1; }
  if (!isFinite(m) || !isFinite(e)) { this.m = 1; this.e = EXP_WALL; return this; }
  if (e >= EXP_WALL) { e = EXP_WALL; m = m < 0 ? -1 : 1; }
  if (e < EXP_FLOOR) { m = 0; e = 0; }
  this.m = m; this.e = e; return this;
};
D.of = function (x) { return new D(x, 0); };
D.log = function (l) {                                   // fromLog10
  if (!isFinite(l)) return l < 0 ? new D(0, 0) : new D(1, EXP_WALL);
  var e = Math.floor(l);
  return new D(Math.pow(10, l - e), e);
};
D.fromLog10 = D.log;
D.ZERO = function () { return new D(0, 0); };
D.ONE = function () { return new D(1, 0); };

D.prototype.isZero = function () { return this.m === 0; };
D.prototype.walled = function () { return this.e >= EXP_WALL; };
D.prototype.copy = function () { return new D(this.m, this.e); };
D.prototype.neg = function () { return new D(-this.m, this.e); };
D.prototype.abs = function () { return new D(Math.abs(this.m), this.e); };

D.prototype.add = function (o) {
  if (this.m === 0) return o.copy();
  if (o.m === 0) return this.copy();
  var a = this, b = o;
  if (b.e > a.e) { a = o; b = this; }
  var dx = b.e - a.e;
  if (dx < -17) return a.copy();
  return new D(a.m + b.m * Math.pow(10, dx), a.e);
};
D.prototype.sub = function (o) { return this.add(o.neg()); };
D.prototype.mul = function (o) {
  if (this.m === 0 || o.m === 0) return new D(0, 0);
  return new D(this.m * o.m, this.e + o.e);
};
D.prototype.div = function (o) {
  if (o.m === 0 || this.m === 0) return new D(0, 0);   // R10: guard zero
  return new D(this.m / o.m, this.e - o.e);
};
D.prototype.mulN = function (x) { return this.mul(D.of(x)); };
D.prototype.log10 = function () {
  if (this.m <= 0) return -Infinity;
  return this.e + Math.log10(this.m);
};
D.prototype.log10z = function () {                       // safe log10, zero -> 0
  if (this.m <= 0) return 0;
  var l = this.e + Math.log10(this.m);
  return l > 0 ? l : 0;
};
D.prototype.pow = function (x) {
  if (x === 0) return new D(1, 0);
  if (this.m === 0) return new D(0, 0);                  // R10: 0^n = 0
  if (this.m === 1 && this.e === 0) return new D(1, 0);
  var s = this.m < 0 ? -1 : 1;
  var l = this.abs().log10() * x;
  var r = D.log(l);
  if (s < 0 && Math.abs(x % 2) === 1) r = r.neg();
  return r;
};
D.prototype.cmp = function (o) {
  var sa = this.m === 0 ? 0 : (this.m > 0 ? 1 : -1);
  var sb = o.m === 0 ? 0 : (o.m > 0 ? 1 : -1);
  if (sa !== sb) return sa < sb ? -1 : 1;
  if (sa === 0) return 0;
  var f = sa > 0 ? 1 : -1;
  if (this.e !== o.e) return this.e < o.e ? -f : f;
  if (this.m === o.m) return 0;
  return this.m < o.m ? -f : f;
};
D.prototype.gte = function (o) { return this.cmp(o) >= 0; };
D.prototype.gt = function (o) { return this.cmp(o) > 0; };
D.prototype.lt = function (o) { return this.cmp(o) < 0; };
D.prototype.lte = function (o) { return this.cmp(o) <= 0; };
D.prototype.max = function (o) { return this.cmp(o) >= 0 ? this.copy() : o.copy(); };
D.prototype.min = function (o) { return this.cmp(o) <= 0 ? this.copy() : o.copy(); };
D.prototype.num = function () {
  if (this.e > 300) return 1e300;
  if (this.e < -300) return 0;
  return this.m * Math.pow(10, this.e);
};
D.prototype.ser = function () { return [this.m, this.e]; };
D.de = function (a) {
  if (a instanceof D) return a.copy();
  if (Array.isArray(a) && a.length === 2) return new D(+a[0] || 0, +a[1] || 0);
  if (typeof a === "number") return D.of(isFinite(a) ? a : 0);
  return new D(0, 0);
};

/* geometric bulk cost: base * r^n0 * (r^k - 1)/(r - 1)  -- exact, overflow-safe */
function geoSum(base, r, n0, k) {
  if (k <= 0) return new D(0, 0);
  var lr = Math.log10(r);
  var tail = D.log(k * lr).sub(D.ONE());
  return base.mul(D.log(n0 * lr)).mul(tail).div(D.of(r - 1));
}
/* largest k with geoSum(base,r,n0,k) <= funds; never overdraws */
function maxBuy(base, r, n0, funds, cap) {
  if (funds.m <= 0) return 0;
  var lr = Math.log10(r);
  var X = funds.mul(D.of(r - 1)).div(base.mul(D.log(n0 * lr)));
  if (X.m <= 0) return 0;
  var L = X.e > 14 ? X.log10() : Math.log10(1 + X.num());
  var k = Math.floor(L / lr);
  if (!isFinite(k) || k < 0) k = 0;
  if (cap !== undefined && k > cap) k = cap;
  var guard = 0;
  while (k > 0 && geoSum(base, r, n0, k).gt(funds) && guard++ < 64) k -= 1;
  guard = 0;
  while ((cap === undefined || k + 1 <= cap) && geoSum(base, r, n0, k + 1).lte(funds) && guard++ < 64) k += 1;
  return k;
}

/* ============================================================================
   2. FORMAT - display helpers, including glyph-aware numeric output
   ========================================================================== */
function fmt(d) {
  if (!(d instanceof D)) d = D.de(d);
  if (d.m === 0) return "0";
  if (d.walled()) return "9.99e250";
  var neg = d.m < 0 ? "-" : "";
  var a = d.abs();
  if (a.e < 0) return neg + a.num().toFixed(2);
  if (a.e < 6) {
    var n = a.num();
    if (a.e < 3) return neg + (n < 10 ? n.toFixed(2) : n.toFixed(1));
    return neg + Math.floor(n).toString();
  }
  return neg + a.m.toFixed(2) + "e" + a.e;
}
function fmtPct(x) { return (x * 100).toFixed(1) + "%"; }
function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
/* Numbers are part of the script too: each digit is a glyph until decoded. */
function numHTML(d) {
  var s = fmt(d), out = "", i;
  for (i = 0; i < s.length; i++) {
    var c = s[i];
    if (c >= "0" && c <= "9") out += digitHTML(c);
    else out += '<span class="dimmer">' + esc(c) + "</span>";
  }
  return '<span class="num">' + out + "</span>";
}
function numHTMLn(n) { return numHTML(D.of(n)); }
function digitHTML(c) {
  var g = SCRIPT.digitGlyph[c];
  if (g === undefined || S.res[g]) return c;
  return glyphSVG(g);
}

/* ============================================================================
   3. CONTENT - every tunable number and every content table lives here.
   Adding an upgrade / lexicon node / canon ability / tier feature / tip is
   ONE array entry and requires no change to logic anywhere else.
   ========================================================================== */
var K = {
  /* --- loop --- */
  STEP: 0.05,             // fixed simulation step (s)
  MAXFRAME: 1.0,          // clamp per frame so a throttled tab cannot explode
  UI_MS: 100,             // 10 Hz text updates
  SAVE_MS: 10000,
  CHUNK: 2.0,             // offline catch-up chunk (s)

  /* --- scribes --- */
  START_SCRIBES: 3,
  SCRIBE_BASE: 15,
  SCRIBE_GROWTH: 2.2,     // R5: log10(2.2)=0.3424 > log10(2)=0.3010 = worst marginal gain
  COPY_POWER: 1.0,
  COUNT_POWER: 0.42,
  CROSS_POWER: 0.16,

  /* --- legibility --- */
  LEG_GAIN: 4,            // legMult = 1 + LEG_GAIN * L^2, L<=1 so bounded by 5

  /* --- decoding ---
     Occurrences are counted in log-magnitude units: occ = OCCK*freq*log10(1+corpus).
     Corpus is exponential in time, so log10(corpus) is roughly linear in time and
     sqrt(occ) grows only as sqrt(t). This keeps decoding a *timed activity* at any
     depth instead of collapsing to instant once corpus is astronomical (R7 damping). */
  OCCK: 60000,
  AN_W: 0.62,             // analysis throughput weight on log10(1+analysisRate)
  CTX_W: 0.44,            // context bonus weight on log10(1+context)
  DEC_BASE: 1.0,
  THR_DIGIT: 1050,
  THR_LETTER: 195000,
  THR_EXTRA: 260000,       // nulls / ligatures / positional forms are harder
  /* A rare mark needs more confidence: the statistical signal is weaker next to
     the noise of a finite corpus. This exponent is what SPREADS the alphabet out
     over the run - without it every glyph resolves at almost the same moment. */
  RARE_REF: 0.06,
  RARE_POW: 1.80,
  RARE_CLAMP: 0.012,   // rarity stops biting below this frequency
  TIER_THR_POW: 1.10,     // threshold scales with (tier)^POW - polynomial, not exponential

  /* --- guessing --- */
  GUESS_BASE: 40,
  GUESS_TIER: 2.1,        // cost multiplier per tier
  PEN_TIME: 20,
  PEN_MULT: 0.35,
  AUTOGUESS_EVERY: 9,
  LIG_CTX: 4.0,           // context needed before ligature work is efficient

  /* --- upgrades --- */
  BLIND_DISC: 0.40,
  DECODE_NAME_BASE: 30,
  DECODE_NAME_TIER: 2.4,

  /* --- transcribe / lexicon --- */
  LEX_LOG_K: 0.155,       // lexGain = 10^(LEX_LOG_K*log10(lifeCorpus) - LEX_OFF) * tierBonus
  LEX_OFF: 0.30,
  LEX_TIER: 1.35,
  LEX_DIV_FLOOR: 1.0,     // R6: conversion divisor floored, loop gain pinned below 1

  /* --- publish --- */
  PUB_BASE: 2.05,          // R8: requirementLog = PUB_BASE*(1+n)^PUB_POW  (log10 lifetime lexicon)
  PUB_POW: 1.50,

  /* --- asymptotic node (the unlimited tail) --- */
  ASYMP_FLOOR: 0.16,      // thresholds approach 16% of base, never reach it
  ASYMP_STEP: 0.85,

  /* --- offline --- */
  OFFLINE_EFF: 0.50,
  OFFLINE_CAP: 4 * 3600,

  /* --- misc --- */
  LOG_MAX: 220,
  NULL_RATE: 0.055
};

/* true English letter frequencies - drive occurrence counts and honest stats */
var LFREQ = {
  a: .0817, b: .0150, c: .0278, d: .0425, e: .1270, f: .0223, g: .0202, h: .0609,
  i: .0697, j: .0015, k: .0077, l: .0403, m: .0241, n: .0675, o: .0751, p: .0193,
  q: .0010, r: .0599, s: .0633, t: .0906, u: .0276, v: .0098, w: .0236, x: .0015,
  y: .0197, z: .0007
};
var ALPHA = "abcdefghijklmnopqrstuvwxyz".split("");
var DIGITS = "0123456789".split("");
var DIGIT_FREQ = 0.030;

/* difficulty features, applied cumulatively as tier rises - one entry per tier */
var TIERS = [
  { tier: 1, name: "plain substitution", feat: [] },
  { tier: 2, name: "homophones", feat: ["homo"] },
  { tier: 3, name: "nulls", feat: ["homo", "null"] },
  { tier: 4, name: "ligatures", feat: ["homo", "null", "lig"] },
  { tier: 5, name: "positional forms", feat: ["homo", "null", "lig", "init"] }
];
var HOMO_LETTERS = ["e", "t", "a", "o", "n"];      // tier 2: these get a second glyph
var NULL_COUNT = 3;                                // tier 3
var LIGS = ["th", "ing", "er"];                    // tier 4
var INIT_LETTERS = ["s", "t", "a", "w", "h"];       // tier 5

/* ---- corpus vocabulary: ~520 common English words ---- */
var WORDS = ("the be to of and a in that have i it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us man find here thing tell try ask need feel become leave put mean keep let begin seem help talk turn start might show hear play run move live believe bring happen write sit stand lose pay meet include continue set learn change lead understand watch follow stop create speak read spend grow open walk win teach offer remember consider appear buy serve die send build stay fall cut reach kill remain suggest raise pass sell require report decide pull hold carry break receive agree support hit produce eat cover catch draw choose cause point return form allow explain hope develop carry describe wear name later long great little own old right big high different small large next early young important few public bad same able best better free true whole sure certain clear common dark deep dry easy empty final full green hard heavy hot late light local low main modern near new normal open past plain poor quick quiet rare ready real recent short simple single slow soft strong sudden thin usual warm weak white wide wild wrong hand part child eye woman place week case point government company number group problem fact word month lot book night thing water room mother area money story month lot right study game line end member law car city name team minute idea kid body information back parent face others level office door health person art war history party result change morning reason research girl guy moment air teacher force education foot boy age policy process music market sense nation plan college interest death experience effect us function defaults() {

    v: SAVE_VER,

    tier: 1,

/* build (or rebuild) the script + per-glyph knowledge arrays */
function newScript(seed, tier) {
  S.seed = seed; S.tier = tier;
  SCRIPT = makeScript(seed, tier);
  S.conf = []; S.res = []; S.pen = [];
  for (var i = 0; i < SCRIPT.count; i++) { S.conf.push(0); S.res.push(0); S.pen.push(0); }
  S.sel = -1;
  ENC_CACHE = {};
}

function freshGame(seed) {
  S = defaults();
  newScript(seed || (1 + Math.floor(Math.random() * 1e9)), 1);
  logAdd("the archive opens a new hand and hands you a page you cannot read", 0);
  logAdd("first job: learn the ten digits", 1);
}

function ser() {
  return {
    v: SAVE_VER, t: S.t, real: Date.now(), seed: S.seed, tier: S.tier, baseTier: S.baseTier,
    corpus: S.corpus.ser(), analysis: S.analysis.ser(), context: S.context.ser(),
    lifeCorpus: S.lifeCorpus.ser(), totalCorpus: S.totalCorpus.ser(),
    scribes: S.scribes, bought: S.bought, upg: S.upg, upgDec: S.upgDec,
    lex: S.lex.ser(), lifeLex: S.lifeLex.ser(), lexOwn: S.lexOwn, lexOn: S.lexOn,
    canon: S.canon, abil: S.abil,
    conf: S.conf.map(function (c) { return Math.round(c * 1e4) / 1e4; }),
    res: S.res.join(""),
    log: S.log.slice(-K.LOG_MAX),
    tips: S.tips, trCount: S.trCount, pubCount: S.pubCount, marks: S.marks

function deser(o) {
  if (!o || o.v !== SAVE_VER) return false;              // migration guard: refuse foreign saves
  var d = defaults(), i;
  S = d;
  S.t = +o.t || 0; S.real = +o.real || 0;
  S.seed = +o.seed || 1; S.tier = +o.tier || 1; S.baseTier = +o.baseTier || 1;
  S.corpus = D.de(o.corpus); S.analysis = D.de(o.analysis); S.context = D.de(o.context);
  S.lifeCorpus = D.de(o.lifeCorpus); S.totalCorpus = D.de(o.totalCorpus);
  S.lex = D.de(o.lex); S.lifeLex = D.de(o.lifeLex);
  if (o.scribes) {
    S.scribes.n = Math.max(1, Math.floor(+o.scribes.n || 1));
    S.scribes.copy = Math.max(0, Math.floor(+o.scribes.copy || 0));
    S.scribes.count = Math.max(0, Math.floor(+o.scribes.count || 0));
    S.scribes.cross = Math.max(0, Math.floor(+o.scribes.cross || 0));
  }
  S.bought = Math.max(0, Math.floor(+o.bought || 0));
  /* unknown ids are dropped defensively, never crash */
  S.upg = pickIds(o.upg, UPGRADES);
  S.upgDec = pickIds(o.upgDec, UPGRADES);
  S.lexOwn = pickIds(o.lexOwn, LEX);
  S.lexOn = pickIds(o.lexOn, LEX);
  S.abil = pickIds(o.abil, CANON_ABIL);
  S.canon = (Array.isArray(o.canon) ? o.canon : []).filter(function (x) { return typeof x === "number" && x >= 0; });
  S.trCount = +o.trCount || 0; S.pubCount = +o.pubCount || 0;
  S.marks = o.marks && typeof o.marks === "object" ? o.marks : {};
  if (o.tips && typeof o.tips === "object") {
    S.tips.seen = o.tips.seen && typeof o.tips.seen === "object" ? o.tips.seen : {};
    S.tips.cur = typeof o.tips.cur === "string" ? o.tips.cur : null;
  }
  S.log = Array.isArray(o.log) ? o.log.filter(function (e) { return e && typeof e.s === "string"; }).slice(-K.LOG_MAX) : [];
  newScript(S.seed, S.tier);
  var res = typeof o.res === "string" ? o.res : "";
  for (i = 0; i < SCRIPT.count; i++) {
    S.conf[i] = Array.isArray(o.conf) && isFinite(+o.conf[i]) ? Math.max(0, +o.conf[i]) : 0;
    S.res[i] = res[i] === "1" ? 1 : 0;
    if (S.res[i]) S.conf[i] = Math.max(1, S.conf[i]);
  }
  return true;
}
function pickIds(src, table) {
  var out = {}, i, id;
  if (!src || typeof src !== "object") return out;
  for (i = 0; i < table.length; i++) {
    id = table[i].id;
    if (src[id] !== undefined && src[id] !== 0 && src[id] !== false) {
      out[id] = typeof src[id] === "number" ? Math.max(0, Math.floor(src[id])) : true;
    }
  }
  return out;
}

/* ---- log: internal strings only. Rendered through the legibility renderer

function logAdd(text, dim) {
  S.log.push({ t: Math.floor(S.t), s: text, d: dim ? 1 : 0 });
  if (S.log.length > K.LOG_MAX) S.log.splice(0, S.log.length - K.LOG_MAX);
  LOG_DIRTY = true;
}

/* ============================================================================
   5. GLYPHS - seeded shape generation on a 4x4 lattice + SVG cache
   Glyphs are drawn, never typed: no font can be relied on, and every
   Transcribe must produce a visually new alphabet.
   ========================================================================== */
function rng32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) {
  var h = (a >>> 0) ^ Math.imul(b + 0x9E3779B9 >>> 0, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  return (h ^ (h >>> 16)) >>> 0;
}

/* one stroke = line | quad-arc | dot on lattice 0..3 */
function strokeKey(s) {
  if (s.t === "d") return "d" + s.x1 + s.y1;
  var a = s.x1 + "" + s.y1, b = s.x2 + "" + s.y2;
  return (a < b ? a + b : b + a) + (s.t === "q" ? "q" : "");
}
function shapeKey(sh) {

  S.pen[gid] = S.t + K.PEN_TIME;
  logAdd("a misreading: that mark is not " + (val === "-" ? "empty" : val), 1);
  STRUCT_DIRTY = true;
  return false;
}
/* frequency-matching heuristic: rank observed glyphs against expected letters */
function bestGuess() {
  var un = [], i, m;
  for (i = 0; i < S.res.length; i++) if (!S.res[i]) un.push(i);
  if (!un.length) return null;
  un.sort(function (a, b) { return SCRIPT.freq[b] - SCRIPT.freq[a]; });
  var used = {};
  for (i = 0; i < S.res.length; i++) if (S.res[i]) used[SCRIPT.meaning[i].t + SCRIPT.meaning[i].v] = 1;
  var gid = un[0];
  m = SCRIPT.meaning[gid];
  /* candidate = the highest-frequency unclaimed value of the same class */
  var pool = m.t === "N" ? DIGITS : m.t === "G" ? LIGS : m.t === "0" ? ["-"] : ALPHA;
  var best = null, bf = -1, j, v;
  for (j = 0; j < pool.length; j++) {
    v = pool[j];
    if (used[m.t + v]) continue;
    var f = m.t === "N" ? 1 : m.t === "G" ? (LIG_FREQ[v] || .01) : m.t === "0" ? 1 : LFREQ[v];
    if (f > bf) { bf = f; best = v; }
  }
  return best === null ? null : { gid: gid, val: best };
}

/* ---- automation ---- */
var autoT = 0;
function autos(dt, E) {
  if (E.autoGuess) {
    autoT += dt;
    while (autoT >= K.AUTOGUESS_EVERY) {
      autoT -= K.AUTOGUESS_EVERY;
      if (S.analysis.gte(D.of(guessCost()).mulN(3))) {
        var g = bestGuess(); if (g) guess(g.gid, g.val);
      }
    }
  }
  if (E.autoTr && legibility() >= 0.999) transcribe();
  if (E.autoPub && S.lifeLex.gte(pubReq())) publish();
}

/* ---- pacing instrumentation ---- */
function mark(E) {
  var mk = S.marks;
  if (!mk.digits && digitsDone()) mk.digits = S.t;
  if (!mk.letter1 && countResolvedLetters() >= 1) mk.letter1 = S.t;
  if (!mk.half && countResolvedLetters() >= 13) mk.half = S.t;
}

/* ---- offline catch-up ---- */
function offlineApply(elapsed) {
  var E = effects();
  var cap = E.offCap, eff = E.offEff;
  var used = Math.min(elapsed, cap);
  if (used < 5) return null;
  var t = 0, chunk = K.CHUNK;
  var budget = used * eff;
  while (t < budget) {
    var d = Math.min(chunk, budget - t);
    step(d); t += d;
  }
  return { away: elapsed, used: used, eff: eff, capped: elapsed > cap };
}

/* ---- R5 sub-critical check (exported for tests) ----------------------------
   Cost of one more scribe:      log10(2.2)                = 0.34242 OOM
   Best possible payback (n=1):  log10((1+1)/1) = log10(2) = 0.30103 OOM
   0.34242 > 0.30103 for every n >= 1 and every upgrade combination, because
   flat power multipliers do not change the MARGINAL ratio (n+1)/n. Therefore
   no cycle in this game can grow without bound in finite time.              */
function subCriticalCheck() {
  var costOOM = Math.log10(K.SCRIBE_GROWTH), worst = 0, n, i, u, E, free = 0;
  E = baseEffects();
  for (i = 0; i < UPGRADES.length; i++) { u = UPGRADES[i]; u.ap(E, u.max); }
  for (i = 0; i < LEX.length; i++) LEX[i].ap(E);
  for (i = 0; i < CANON_ABIL.length; i++) CANON_ABIL[i].ap(E, 40);
  free = E.freeScribes;
  for (n = 1; n < 5000; n++) {
    var gain = Math.log10((n + 1 + free + K.START_SCRIBES) / (n + free + K.START_SCRIBES));
    if (gain > worst) worst = gain;
  }
  var gain0 = Math.log10((1 + 1) / 1);                    // absolute worst case, no free scribes
  worst = Math.max(worst, gain0);
  return { costOOM: costOOM, gainOOM: worst, ok: costOOM > worst };
}

/* repeatable-upgrade marginal check: cost growth must exceed the multiplier */
function upgSubCritical() {
  var out = [], i, u;
  for (i = 0; i < UPGRADES.length; i++) {
    u = UPGRADES[i];
    if (u.max < 100) continue;                            // bounded upgrades cannot run away
    var E0 = baseEffects(), E1 = baseEffects();
    u.ap(E0, 10); u.ap(E1, 11);
    var g = Math.max(
      E1.copyP.log10() - E0.copyP.log10(),
      E1.countP.log10() - E0.countP.log10(),
      E1.crossP.log10() - E0.crossP.log10());
    out.push({ id: u.id, cost: Math.log10(u.growth), gain: g, ok: Math.log10(u.growth) > g });
  }
  return out;
}

   9. PROGRESSION - transcribe / lexicon / publish / the asymptotic tail
   ========================================================================== */
function resetScript(tier) {
  S.corpus = D.ZERO(); S.analysis = D.ZERO(); S.context = D.ZERO();
  S.lifeCorpus = D.ZERO();
  S.bought = 0;
  S.upg = {}; S.upgDec = {};
  S.scribes.copy = K.START_SCRIBES; S.scribes.count = 0; S.scribes.cross = 0;
  newScript(hash2(S.seed, 0x1f2e3d4c ^ (S.trCount * 7919 + S.pubCount * 104729)), tier);
  var E = effects();
  S.scribes.copy = Math.max(1, E.total - 0);
  S.scribes.count = 0; S.scribes.cross = 0;
  clampAlloc(E.total);

}

/* LAYER 1 - TRANSCRIBE: at full legibility, reset the script one tier higher */
function canTranscribe() { return legibility() >= 0.999; }
function transcribe() {
  if (!canTranscribe()) return false;
  var g = lexGain();
  S.lex = S.lex.add(g); S.lifeLex = S.lifeLex.add(g);
  S.trCount++;
  if (!S.marks.tr1) S.marks.tr1 = S.t;
  logAdd("transcribed the script and filed it; the lexicon grows by " + fmt(g), 0);
  resetScript(S.tier + 1);
  logAdd("a new hand, one tier harder: " + SCRIPT.tierName, 1);
  return true;
}

/* LAYER 2 - LEXICON: permanent, individually switchable */
function lexAvail(nd) {
  var i;
  for (i = 0; i < nd.req.length; i++) if (!S.lexOwn[nd.req[i]]) return false;
  if (nd.canon && S.canon.length < nd.canon) return false;
  return true;
}
function lexBuy(id) {
  var nd = byId(LEX, id); if (!nd || S.lexOwn[id] || !lexAvail(nd)) return false;
  var c = D.of(nd.cost);
  if (S.lex.lt(c)) return false;
  S.lex = S.lex.sub(c);
  S.lexOwn[id] = true; S.lexOn[id] = true;

  STRUCT_DIRTY = true;
  return true;
}
function lexToggle(id) {

/* LAYER 3 - PUBLISH: reset the lexicon for a canon passage + a permanent ability */
function canPublish() { return S.lifeLex.gte(pubReq()); }
function passageText(i) {
  if (i < CANON_TEXT.length) return CANON_TEXT[i];
  var r = rng32(hash2(0x2a3b4c5d, i));
  var t = TEMPLATES[Math.floor(r() * TEMPLATES.length)].replace(/\{\}/g, function () {
    return WORDSET[Math.floor(r() * WORDSET.length)];

}

  S.abil[ab.id] = (S.abil[ab.id] || 0) + 1;
  S.canon.push(idx);
  S.pubCount++;
  S.lex = D.ZERO(); S.lifeLex = D.ZERO(); S.lexOwn = {}; S.lexOn = {};
  S.baseTier++;

      if (E.crib) { var xx = $("gx" + i); if (xx) setT(xx, String(++rank)); }
    }
  }
  if (R.gc) setH(R.gc, numHTML(gc));

  /* tech */
  for (var u = 0; u < UPGRADES.length; u++) {
    var uu = UPGRADES[u], lv = upgLevel(uu.id);
    if (lv >= uu.max) continue;
    var full = upgPrice(uu, false), bl = upgPrice(uu, true), have = resOf(uu.res);
    var ce = $("uc" + uu.id); if (ce) setH(ce, numHTML(full));
    var be = $("ub" + uu.id); if (be) cls(be, "ok", have.gte(full));
    var de = $("ud" + uu.id); if (de) { setH(de, numHTML(bl)); cls(de.parentNode, "ok", have.gte(bl)); }
    var ne = $("un" + uu.id);
    if (ne) { setH(ne, numHTML(D.of(nameCost()))); cls(ne.parentNode, "ok", S.analysis.gte(D.of(nameCost()))); }
  }
  setH(R.upn, numHTMLn(Object.keys(S.upg).length));

  /* transcribe / lexicon / canon */
  setT(R.trleg, fmtPct(L));
  setH(R.trc, canTranscribe() ? "+" + fmt(lexGain()) : "at 100%");
  cls($("trc").parentNode, "ok", canTranscribe());
  $("trc").parentNode.disabled = !canTranscribe();
  setT(R.lxn, fmt(S.lex) + " lexicon");
  for (var l = 0; l < LEX.length; l++) {
    var nd = LEX[l];
    if (S.lexOwn[nd.id] || !lexAvail(nd)) continue;
    var lb = $("lb" + nd.id);
    if (lb) cls(lb, "ok", S.lex.gte(D.of(nd.cost)));
  }
  var req = pubReq();
  setT(R.pubv, fmt(S.lifeLex) + " / " + fmt(req));
  setW(R.pubb, Math.min(100, 100 * S.lifeLex.log10z() / Math.max(1e-9, req.log10z())));
  cls($("pubb"), "on", canPublish());
  setT(R.pubc, canPublish() ? "ready" : "not yet");
  cls($("pubc").parentNode, "ok", canPublish());
  $("pubc").parentNode.disabled = !canPublish();
  setT(R.cnn, S.canon.length + " passages");
  setT(R.arv, "saved " + fmtTime(Math.max(0, S.t - SAVED_AT)) + " ago");
  updateTip();
}
function upRes(name, val, rate, target) {
  setH(R[name + "N"], renderText(RES_NAMES[name]));
  setH(R[name + "V"], numHTML(val));
  setH(R[name + "R"], "+" + numHTML(rate));
  var p = target && !target.isZero() ? Math.min(1, Math.max(0, val.div(target).num())) : 0;
  setW(R[name + "B"], p * 100);
  cls(R[name + "B"].parentNode, "on", p >= 1);
}

/* ---------------- tips ---------------------------------------------------- */
function updateTip() {
  var i, t;
  if (S.tips.cur) {
    t = byId(TIPS, S.tips.cur);
    if (!t || !safeWhen(t)) { S.tips.seen[S.tips.cur] = 1; S.tips.cur = null; }  // played past it = read it
  }
  if (!S.tips.cur) {
    for (i = 0; i < TIPS.length; i++) {
      t = TIPS[i];
      if (!S.tips.seen[t.id] && safeWhen(t)) { S.tips.cur = t.id; break; }
    }
  }
  if (!S.tips.cur) { setH(R.tip, ""); return; }
  t = byId(TIPS, S.tips.cur);
  setH(R.tip, "<b>" + esc(t.head) + "</b>" + esc(t.text) +
    '<button class="tipx" data-a="tipx">[dismiss]</button>');
}
function safeWhen(t) { try { return !!t.when(); } catch (e) { return false; } }

/* ---------------- guided tour: spotlight the real controls --------------- */
var TOUR_I = -1, TOUR_EL = null;

function tourOn() { return TOUR_I >= 0; }
function tourStart() { TOUR_I = -1; tourGo(0); }
function tourGo(i) {
  if (i >= TOUR.length) { tourEnd(); return; }
  if (i < 0) i = 0;
  TOUR_I = i;
  var st = TOUR[i];
  if (st.pre) { try { st.pre(); } catch (e) {} }
  if (STRUCT_DIRTY) updateUI();
  var el = $(st.t);
  if (TOUR_EL && TOUR_EL !== el) TOUR_EL.classList.remove("spot");
  TOUR_EL = el;
  if (el) {
    el.classList.add("spot");
    if (el.scrollIntoView) {
      try { el.scrollIntoView({ block: "center", behavior: "auto" }); } catch (e) { el.scrollIntoView(); }
    }
  }
  $("tb").classList.add("show");
  var c = $("tc");
  c.innerHTML =
    '<div class="grp">' + esc(st.grp) + "</div>" +
    "<h3>" + esc(st.head) + "</h3>" +
    "<p>" + esc(st.text) + "</p>" +
    '<div class="nav">' +
    '<button data-a="tprev"' + (i === 0 ? " disabled" : "") + ">back</button>" +
    '<button data-a="tnext" class="pri">' + (i === TOUR.length - 1 ? "done" : "next") + "</button>" +
    '<button data-a="tdone">skip</button>' +
    '<span class="dots">' + (i + 1) + " / " + TOUR.length + "</span></div>";
  c.classList.add("show");
  tourPos(el);
}
function tourEnd() {
  if (TOUR_EL) TOUR_EL.classList.remove("spot");
  TOUR_EL = null; TOUR_I = -1;
  $("tb").classList.remove("show");
  $("tc").classList.remove("show");
}
/* place the card beside the highlighted element, clamped to the viewport */
function tourPos(el) {
  var c = $("tc");
  if (!c.style) return;
  var vw = typeof window !== "undefined" && window.innerWidth ? window.innerWidth : 1200;
  var vh = typeof window !== "undefined" && window.innerHeight ? window.innerHeight : 800;
  var cw = c.offsetWidth || 340, ch = c.offsetHeight || 150;
  var r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
  if (!r || (!r.width && !r.height)) {
    c.style.left = Math.max(8, (vw - cw) / 2) + "px";
    c.style.top = Math.max(8, (vh - ch) / 2) + "px";
    return;
  }
  var left = r.left, top = r.bottom + 10;
  if (top + ch > vh - 8) top = r.top - ch - 10;
  if (top < 8) top = Math.min(vh - ch - 8, r.bottom + 10);
  if (top < 8) top = 8;
  if (left + cw > vw - 8) left = vw - cw - 8;
  if (left < 8) left = 8;
  c.style.left = left + "px";
  c.style.top = top + "px";
}

/* ---------------- events -------------------------------------------------- */
function wire() {
  document.body.addEventListener("click", function (ev) {
    var n = ev.target, a = null, guard = 0;
    while (n && guard++ < 6) { if (n.getAttribute && n.getAttribute("data-a")) { a = n; break; } n = n.parentNode; }
    if (!a) return;
    var act = a.getAttribute("data-a");
    var id = a.getAttribute("data-i"), t = a.getAttribute("data-t"), v = a.getAttribute("data-v");
    if (act === "p") assign(t, 1);
    else if (act === "m") assign(t, -1);
    else if (act === "buy1") buyScribes(1);
    else if (act === "buymax") buyScribes("max");
    else if (act === "sel") { S.sel = +id; STRUCT_DIRTY = true; }
    else if (act === "g") guess(S.sel, v);
    else if (act === "up") buyUpg(id, false);
    else if (act === "ub") buyUpg(id, true);
    else if (act === "dn") decodeName(id);
    else if (act === "lb") lexBuy(id);
    else if (act === "lt") lexToggle(id);
    else if (act === "tr") transcribe();
    else if (act === "pub") publish();
    else if (act === "tipx") { if (S.tips.cur) { S.tips.seen[S.tips.cur] = 1; S.tips.cur = null; } }
    else if (act === "exp") doExport();
    else if (act === "dl") doDownload();
    else if (act === "imp") doImport();
    else if (act === "reset") doReset(a);
    else if (act === "tnext") { tourGo(TOUR_I + 1); return; }
    else if (act === "tprev") { tourGo(TOUR_I - 1); return; }
    else if (act === "tdone") { tourEnd(); }
    updateUI();
  });
  $("bhelp").addEventListener("click", function () { tourStart(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") tourEnd();
    else if (tourOn() && (e.key === "ArrowRight" || e.key === "Enter")) tourGo(TOUR_I + 1);
    else if (tourOn() && e.key === "ArrowLeft") tourGo(TOUR_I - 1);
  });
  window.addEventListener("resize", function () { if (tourOn()) tourPos(TOUR_EL); });
}

/* ============================================================================
   11. BOOT - save/load, offline catch-up, fixed-step loop, event wiring
   ========================================================================== */
var LS = (function () {
  try { if (typeof localStorage !== "undefined") return localStorage; } catch (e) {}
  var m = {};
  return { getItem: function (k) { return m[k] === undefined ? null : m[k]; },
           setItem: function (k, v) { m[k] = String(v); },
           removeItem: function (k) { delete m[k]; } };
})();
function b64e(s) { return typeof btoa === "function" ? btoa(s) : Buffer.from(s, "utf8").toString("base64"); }
function b64d(s) { return typeof atob === "function" ? atob(s) : Buffer.from(s, "base64").toString("utf8"); }

var SAVED_AT = 0;
function save() {
  try {
    SAVED_AT = S.t;
    LS.setItem(SAVE_KEY, b64e(JSON.stringify(ser())));
    return true;
  } catch (e) { return false; }
}
function load() {
  var raw = null;
  try { raw = LS.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try { return deser(JSON.parse(b64d(raw))); } catch (e) { return false; }
}

function doExport() {
  R.sav.value = b64e(JSON.stringify(ser()));
  R.sav.select();
  try { if (navigator.clipboard) navigator.clipboard.writeText(R.sav.value); } catch (e) {}
  logAdd("the save is in the box and on the clipboard", 1);
}
function doDownload() {
  var blob = new Blob([b64e(JSON.stringify(ser()))], { type: "text/plain" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "cipher-save.txt"; a.click();
}
function doImport() {
  var v = (R.sav.value || "").trim();
  if (!v) return;
  try {
    if (deser(JSON.parse(b64d(v)))) { logAdd("a save was imported", 1); STRUCT_DIRTY = true; save(); }
  } catch (e) { logAdd("that save could not be read", 1); }
}
var resetArm = 0;
function doReset(btn) {
  if (Date.now() - resetArm > 4000) { resetArm = Date.now(); btn.textContent = "press again to erase everything"; return; }
  resetArm = 0; hardReset();
}

/* ---- offline catch-up: bounded chunks, reported in one dim line ---- */
function catchUp() {
  if (!S.real) return;
  var elapsed = (Date.now() - S.real) / 1000;
  if (elapsed < 5 || !isFinite(elapsed)) return;
  var r = offlineApply(elapsed);
  if (r) logAdd("away for " + fmtTime(r.away) + "; the scribes worked " + fmtTime(r.used * r.eff) +
    " of it" + (r.capped ? " and reached the limit" : ""), 1);
}

/* ---- fixed-step loop ---- */
var acc = 0, lastT = 0, uiT = 0, saveT = 0;
function now() { return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); }
function frame() {
  var t = now(), dt = (t - lastT) / 1000;
  lastT = t;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > K.MAXFRAME) dt = K.MAXFRAME;                   // a throttled tab cannot explode the sim
  acc += dt;
  var guard = 0;
  while (acc >= K.STEP && guard++ < 400) { step(K.STEP); acc -= K.STEP; }
  if (t - FEED_T > 4000) { FEED_T = t; FEED = genLine(strHash("f" + Math.floor(S.t))); }
  if (t - uiT >= K.UI_MS) { uiT = t; updateUI(); }
  if (t - saveT >= K.SAVE_MS) { saveT = t; save(); }
  requestAnimationFrame(frame);
}

function boot() {
  if (!load()) { freshGame(); FIRST_RUN = true; }
  SAVED_AT = S.t;
  LAST_E = effects();
  clampAlloc(LAST_E.total);
  FEED = genLine(1234);
  catchUp();
  buildUI();
  if (FIRST_RUN) tourStart();
  lastT = now(); uiT = 0; saveT = now();
  updateUI();
  document.addEventListener("visibilitychange", save);
  window.addEventListener("beforeunload", save);
  requestAnimationFrame(frame);
}
var FIRST_RUN = false;

/* test hook: the headless harness drives the game through this */
var CIPHER_API = {
  D: D, K: K, geoSum: geoSum, maxBuy: maxBuy,
  get S() { return S; }, get SCRIPT() { return SCRIPT; },
  UPGRADES: UPGRADES, LEX: LEX, CANON_ABIL: CANON_ABIL, TIPS: TIPS, CANON_TEXT: CANON_TEXT,
  freshGame: freshGame, newScript: newScript, makeScript: makeScript,
  buildAlphabet: buildAlphabet, shapeKey: shapeKey, tooSimilar: tooSimilar,
  shapeOk: shapeOk, glyphSVG: glyphSVG,
  encode: encode, plainOf: plainOf, renderText: renderText, genLine: genLine,
  effects: effects, step: step, legibility: legibility, threshold: threshold, occ: occ,
  confRate: confRate, scribeCost: scribeCost, buyScribes: buyScribes,
  upgCost: upgCost, upgPrice: upgPrice, buyUpg: buyUpg, decodeName: decodeName,
  guess: guess, bestGuess: bestGuess, guessCost: guessCost, guessValue: guessValue,
  assign: assign, unassigned: unassigned, resolve: resolve, logAdd: logAdd,
  transcribe: transcribe, canTranscribe: canTranscribe, lexBuy: lexBuy, lexAvail: lexAvail,
  lexToggle: lexToggle, publish: publish, canPublish: canPublish, pubReq: pubReq, lexGain: lexGain,
  passageText: passageText, hardReset: hardReset,
  ser: ser, deser: deser, save: save, load: load, offlineApply: offlineApply,
  subCriticalCheck: subCriticalCheck, upgSubCritical: upgSubCritical,
  fmt: fmt, numHTML: numHTML, digitsDone: digitsDone, countResolvedLetters: countResolvedLetters,
  buildUI: buildUI, updateUI: updateUI, boot: boot,
  TOUR: TOUR, tourStart: tourStart, tourGo: tourGo, tourEnd: tourEnd, tourOn: tourOn, setS: function (x) { S = x; }

  else boot();
}
