<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incremental Games Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --success: #22c55e;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
        --border: #e2e8f0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .play-btn {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      background-color: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Incremental Games Directory</h1>
    <p class="subtitle">Search available idle and incremental web projects.</p>
    
    <input 
      type="text" 
      id="searchInput" 
      class="search-input" 
      placeholder="Search games..."
      oninput="filterGames()"
    >
  </header>

  <main>
    <div id="gameGrid" class="game-grid"></div>
  </main>

  <footer>
    <p>Hosted on GitHub Pages</p>
  </footer>

  <script>
    const games = [
      "signal",
    ];

    function renderGames(gameList) {
      const grid = document.getElementById('gameGrid');

      if (gameList.length === 0) {
        grid.innerHTML = `<div class="empty-state">No games found matching your search.</div>`;
        return;
      }

      grid.innerHTML = gameList.map(folder => {
        const displayName = folder.replace(/[-_]/g, ' ');
        return `
          <a href="./${folder}/" class="game-card">
            <div>
              <div class="card-header">
                <span class="game-title">${displayName}</span>
                <span class="status-badge">Ready</span>
              </div>
            </div>
            <div class="play-btn">Play Game &rarr;</div>
          </a>
        `;
      }).join('');
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = games.filter(folder => 
        folder.toLowerCase().includes(query) || 
        folder.replace(/[-_]/g, ' ').toLowerCase().includes(query)
      );
      renderGames(filtered);
    }

    // Render initially
    renderGames(games);
  </script>

</body>
</html>
