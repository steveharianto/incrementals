<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incremental Games Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --success: #22c55e;
      --warning: #eab308;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
        --border: #e2e8f0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    /* Search Control */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    /* Game List Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game-card.available:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: capitalize;
      word-break: break-word;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      white-space: nowrap;
    }

    .status-badge.available {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .status-badge.no-index {
      background-color: rgba(234, 179, 8, 0.15);
      color: var(--warning);
    }

    .play-btn {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      background-color: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Incremental Games Directory</h1>
    <p class="subtitle">Search available idle and incremental web projects directly from this repo.</p>
    
    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Type a game name to check availability..."
        oninput="filterGames()"
      >
    </div>
  </header>

  <main>
    <div id="gameGrid" class="game-grid">
      <div class="empty-state">Scanning repository for games...</div>
    </div>
  </main>

  <footer>
    <p>Auto-indexed via GitHub API • Hosted on GitHub Pages</p>
  </footer>

  <script>
    // Config: Pointing to your GitHub username and repo name
    const GITHUB_USER = 'steveharianto';
    const REPO_NAME = 'incremental';

    let allGames = [];

    async function fetchRepoContents() {
      const grid = document.getElementById('gameGrid');
      
      try {
        // Fetch contents of the repository root
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`);
        
        if (!response.ok) {
          throw new Error('Failed to fetch repo data');
        }

        const data = await response.json();

        // Filter only subdirectories (folders) and exclude metadata/hidden folders
        const folderItems = data.filter(item => 
          item.type === 'dir' && !item.name.startsWith('.') && !item.name.startsWith('_')
        );

        if (folderItems.length === 0) {
          grid.innerHTML = '<div class="empty-state">No game folders found in this repository yet.</div>';
          return;
        }

        // Check each folder for an index.html file
        allGames = await Promise.all(
          folderItems.map(async (folder) => {
            const cleanName = folder.name.replace(/[-_]/g, ' ');
            const gameUrl = `./${folder.name}/`;
            
            // Check if index.html actually exists in the folder
            let isAvailable = false;
            try {
              const checkIndex = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${folder.name}/index.html`);
              isAvailable = checkIndex.ok;
            } catch (e) {
              isAvailable = false;
            }

            return {
              folderName: folder.name,
              displayName: cleanName,
              url: gameUrl,
              available: isAvailable
            };
          })
        );

        renderGames(allGames);

      } catch (error) {
        grid.innerHTML = `<div class="empty-state">Unable to load directory directly from GitHub API. Ensure your repository is public.</div>`;
      }
    }

    function renderGames(games) {
      const grid = document.getElementById('gameGrid');

      if (games.length === 0) {
        grid.innerHTML = `<div class="empty-state">No games match your search.</div>`;
        return;
      }

      grid.innerHTML = games.map(game => `
        <a 
          href="${game.available ? game.url : '#'}" 
          class="game-card ${game.available ? 'available' : ''}"
          ${!game.available ? 'onclick="event.preventDefault();"' : ''}
        >
          <div>
            <div class="card-header">
              <span class="game-title">${game.displayName}</span>
              <span class="status-badge ${game.available ? 'available' : 'no-index'}">
                ${game.available ? 'Ready' : 'No index.html'}
              </span>
            </div>
          </div>
          <div class="play-btn">
            ${game.available ? 'Play Game &rarr;' : 'Unavailable'}
          </div>
        </a>
      `).join('');
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const filtered = allGames.filter(game => 
        game.displayName.toLowerCase().includes(query) || 
        game.folderName.toLowerCase().includes(query)
      );

      renderGames(filtered);
    }

    // Initialize scan on load
    fetchRepoContents();
  </script>

</body>
</html>
